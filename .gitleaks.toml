# Secret scanning (the "Secret scan" CI job). Uses gitleaks' default rules, plus narrow
# exceptions for made-up values in tests that only look like secrets. Add an exception
# only for a value that is certainly not a real secret, and say where it comes from.

[extend]
useDefault = true

[[allowlists]]
description = "Made-up Web Push subscription keys in src/lib/push.test.ts and src/app/api/push/route.test.ts (step 26). Not real keys; later replaced with obviously fake ones."
regexes = [
  '''^BNcRdreALRFXTkOO[A-Za-z0-9_-]*$''',
  '''^tBHItJI5svbpez7KI4CCXg$''',
]

[[allowlists]]
description = "A made-up reply token in src/lib/agent/agent-units.test.ts (step 51): the digits 0-9 and a-f twice. Not a real token; later built at runtime."
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^0123456789abcdef$''',
]

[[allowlists]]
description = "Made-up account and position labels in the sample people's per-lane extras (src/data-sources/demo/people-extras/, step 252), such as key: \"investing-old401k\". Each is a lane prefix and a word, not a secret."
# Both must match, so a real secret in these files is still caught.
condition = "AND"
paths = ['''src/data-sources/demo/people-extras/[a-z]+\.ts''']
regexes = ['''^(loans|taxes|insurance|investing|thinking)-[a-z0-9-]+$''']

[[allowlists]]
description = "A sample account's key name in src/data-sources/demo/people-extras/investing.ts (step 262), \"investing-old401k\": a label for a made-up former-employer 401(k) in the demo data. Not a key."
regexes = [
  '''^investing-old401k$''',
]
