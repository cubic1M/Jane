name: CI

on:
  # Branches are checked through their pull request; a push to a branch with a PR would
  # otherwise run everything twice.
  push:
    branches: [main]
  # "labeled" too: a PR made with its "e2e" label (gh pr create --label e2e) can start its first
  # run before the label is on it, and the shards then skip.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # The merge train (merge-train.yml) starts CI on a branch it brought up to date, since
  # pushes made with the workflow token start no workflows.
  workflow_dispatch:

# A newer push to the same pull request cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A PR can't lower an accuracy baseline, change the protected files or call something a fix
  # without proof, unless a founder says so. The rules are read from the base commit, so a PR
  # can't rewrite them. Under a minute on most PRs; a fix adds its proof (see docs/gates.md).
  gates:
    name: Gates
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Baselines, protected files, weakened tests
        id: static
        env:
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOUNDER_LOGINS: ${{ vars.FOUNDER_LOGINS }}
        run: |
          # A run started by hand reports on this commit, so it judges every open PR with this
          # commit from this repo, whatever branch it was started on.
          numbers="$EVENT_NUMBER"
          if [ -z "$numbers" ]; then
            numbers=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
              '[.[] | select(.state == "open" and .head.repo.full_name == env.GITHUB_REPOSITORY) | .number] | join(" ")')
          fi
          [ -n "$numbers" ] || echo "No open PR has this commit."
          failed=0
          proofs=""
          for number in $numbers; do
            git fetch -q --no-tags --depth=2 origin "refs/pull/$number/merge"
            git checkout -q -f FETCH_HEAD
            if ! git cat-file -e HEAD^1:.github/scripts/gates/cli.mjs 2>/dev/null; then
              echo "#$number: the base commit has no gates yet, so they don't judge the PR that brings them."
              continue
            fi
            # The rules come from the base commit, so a PR can't rewrite them.
            scripts="$RUNNER_TEMP/gates-$number"
            mkdir -p "$scripts"
            git archive HEAD^1 .github/scripts/gates | tar -x -C "$scripts"
            out="$RUNNER_TEMP/out-$number"
            GITHUB_OUTPUT="$out" node "$scripts/.github/scripts/gates/cli.mjs" --pr "$number" \
              --base HEAD^1 --head HEAD || failed=1
            if grep -q '^proof=true$' "$out"; then proofs="$proofs $number"; fi
          done
          echo "proofs=$proofs" >> "$GITHUB_OUTPUT"
          exit "$failed"
      # A fix's proof needs what the tests need. Everything else stops here.
      - if: steps.static.outputs.proofs != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.static.outputs.proofs != ''
        uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.static.outputs.proofs != '' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.static.outputs.proofs != '' && steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - name: Proof of fix (fails on the base commit's source, passes on the PR's)
        if: steps.static.outputs.proofs != ''
        env:
          PROOFS: ${{ steps.static.outputs.proofs }}
        run: |
          failed=0
          for number in $PROOFS; do
            git fetch -q --no-tags --depth=2 origin "refs/pull/$number/merge"
            git checkout -q -f FETCH_HEAD
            node "$RUNNER_TEMP/gates-$number/.github/scripts/gates/proof.mjs" \
              --base HEAD^1 --head HEAD || failed=1
          done
          exit "$failed"

  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    needs: [gates]
    if: always()
    steps:
      - run: test "${{ needs.gates.result }}" = success || test "${{ needs.gates.result }}" = skipped
