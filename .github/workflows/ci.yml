name: CI

on:
  # Branches are checked through their pull request; a push to a branch with a PR would
  # otherwise run everything twice.
  push:
    branches: [main]
  # "labeled" too: a PR made with its "e2e" label (gh pr create --label e2e) can start its first
  # run before the label is on it, and the shards then skip.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # The merge train (merge-train.yml) starts CI on a branch it brought up to date, since
  # pushes made with the workflow token start no workflows.
  workflow_dispatch:

# A newer push to the same pull request cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static checks and the unit tests run as parallel jobs; "Lint, typecheck and unit tests"
  # at the end is the one name the branch ruleset requires, and it fails if any of them did.
  static:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The Prisma client is generated from the schema, so it is rebuilt on every run.
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The database lives in memory: the tests' writes never wait on the runner's disk.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      # Vitest starts the files that took longest last time first, from its results file, so a
      # shard doesn't end on one slow file running alone. Kept between runs, per shard.
      - uses: actions/cache@v6
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: vitest-results-${{ matrix.shard }}-
      - name: No waiting on commits (a throwaway database)
        run: node scripts/fast-test-postgres.mjs "$TEST_DATABASE_URL"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Row-level security on every table, as each deploy does
        run: node scripts/rls-protect.mjs "$TEST_DATABASE_URL"
      # Trial and retention cleanup delete every expired sample person in the database, and the
      # learning loop rebuilds its stats from every person in it (which ranking reads), so they
      # run on their own after shard 1's tests, never alongside tests that make people.
      - run: >-
          npx vitest run --shard=${{ matrix.shard }}/4
          --exclude src/lib/trial.integration.test.ts
          --exclude src/lib/retention.integration.test.ts
          --exclude src/lib/learning.integration.test.ts
      - if: matrix.shard == 1
        name: Trial, retention and learning-loop tests, alone
        run: >-
          npx vitest run --no-file-parallelism
          src/lib/trial.integration.test.ts src/lib/retention.integration.test.ts
          src/lib/learning.integration.test.ts

  # A PR can't lower an accuracy baseline, change the protected files or call something a fix
  # without proof, unless a founder says so. The rules are read from the base commit, so a PR
  # can't rewrite them. Under a minute on most PRs; a fix adds its proof (see docs/gates.md).
  gates:
    name: Gates
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - name: Go to the PR as it would merge, with the base commit's gates
        id: pr
        env:
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A run started by hand on a branch is judged like the branch's PR.
          NUMBER="${EVENT_NUMBER:-$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number // empty')}"
          if [ -z "$NUMBER" ]; then echo "No open PR for this branch."; exit 0; fi
          git fetch -q --no-tags --depth=2 origin "refs/pull/$NUMBER/merge"
          git checkout -q FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/gates"
          if git cat-file -e HEAD^1:.github/scripts/gates/cli.mjs 2>/dev/null; then
            git archive HEAD^1 .github/scripts/gates | tar -x -C "$RUNNER_TEMP/gates"
            echo "scripts=$RUNNER_TEMP/gates/.github/scripts/gates" >> "$GITHUB_OUTPUT"
          else
            echo "The base commit has no gates yet: this PR brings them, so they don't judge it."
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Baselines, protected files, weakened tests
        id: static
        if: steps.pr.outputs.scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOUNDER_LOGINS: ${{ vars.FOUNDER_LOGINS }}
        run: >-
          node "${{ steps.pr.outputs.scripts }}/cli.mjs" --pr "${{ steps.pr.outputs.number }}"
          --base HEAD^1 --head HEAD
      # A fix's proof needs what the tests need. Everything else stops here.
      - if: steps.static.outputs.proof == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.static.outputs.proof == 'true'
        uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.static.outputs.proof == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.static.outputs.proof == 'true' && steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - name: Proof of fix (fails on the base commit's source, passes on the PR's)
        if: steps.static.outputs.proof == 'true'
        run: node "${{ steps.pr.outputs.scripts }}/proof.mjs" --base HEAD^1 --head HEAD

  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    needs: [static, unit, gates]
    if: always()
    steps:
      - name: Fail if any part failed or was skipped
        run: |
          echo "static: ${{ needs.static.result }}, unit: ${{ needs.unit.result }}, gates: ${{ needs.gates.result }}"
          test "${{ needs.static.result }}" = success && test "${{ needs.unit.result }}" = success
          # The gates skip only where there is no PR (main and the merge group).
          test "${{ needs.gates.result }}" = success || test "${{ needs.gates.result }}" = skipped

  # The end-to-end tests run against a production build, made once here and handed to both
  # shards: `next start` serves every page at once, where `next dev` compiled each page on its
  # first visit, which made the shards slow and their timings flaky.
  e2e-build:
    name: End-to-end build
    # Every run on main, whatever started it (the merge train starts main's runs with
    # workflow_dispatch, not push, so "push" alone skipped them; 10-27 a dock change reached
    # main untested), and PRs labelled "e2e".
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'merge_group' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      # The build's own cache: an unchanged page isn't built again.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'prisma/schema.prisma') }}
          restore-keys: next-build-${{ hashFiles('package-lock.json') }}-
      # The landing page is built ahead, so what it shows (Try Jane) is decided here; the same
      # switches are on when the server runs (playwright.config.ts).
      - run: npm run build
        env:
          TRY_JANE: "1"
          DEMO_BANK: "1"
          DEMO_ADVICE: "1"
          SIMULATED_AGENT: "1"
      # Each main page's first-load JavaScript against src/config/perf-budget.json.
      - name: Check the first-load JavaScript budget
        run: npm run check:perf-budget
      - name: Pack the build (without its cache)
        run: tar --exclude=.next/cache -cf next-build.tar .next
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: next-build.tar
          retention-days: 1

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    # Three shards, each serving the one build (about 8 minutes each; with no page to compile, a
    # shard costs only its minute of setup). It runs on main after each merge and on PRs
    # labelled "e2e", not on every PR push, so the other checks get runners sooner.
    needs: [e2e-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The database lives in memory: the tests' writes never wait on the runner's disk.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/e2e
      # playwright.config.ts: `next start` on the build, with what the tests need turned on.
      E2E_PROD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
      - name: Unpack the build
        run: tar -xf next-build.tar
      - run: npx playwright install --with-deps chromium
      - name: No waiting on commits (a throwaway database)
        run: node scripts/fast-test-postgres.mjs "$E2E_DATABASE_URL"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.E2E_DATABASE_URL }}
      - name: Row-level security on every table, as each deploy does
        run: node scripts/rls-protect.mjs "$E2E_DATABASE_URL"
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      # A flaky failure can't be read from the log alone: keep its error context and the retry's
      # trace (npx playwright show-trace) for a week.
      - name: Keep the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The one end-to-end result the branch ruleset requires: it passes when the build and every
  # shard passed, or when the end-to-end tests didn't run (a PR without the "e2e" label), so
  # auto-merge waits for the shards of a labelled PR by itself.
  e2e-result:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [e2e-build, e2e]
    if: always()
    steps:
      - name: Fail if the build or any shard failed or was cancelled
        run: |
          echo "build: ${{ needs.e2e-build.result }}, e2e: ${{ needs.e2e.result }}"
          ok() { test "$1" = success || test "$1" = skipped; }
          ok "${{ needs.e2e-build.result }}" && ok "${{ needs.e2e.result }}"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails on known high or critical vulnerabilities in what ships to production.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
