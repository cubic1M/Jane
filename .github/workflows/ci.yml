name: CI

on:
  # Branches are checked through their pull request; a push to a branch with a PR would
  # otherwise run everything twice.
  push:
    branches: [main]
  # "labeled" too: a PR made with its "e2e" label (gh pr create --label e2e) can start its first
  # run before the label is on it, and the shards then skip.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # The merge train (merge-train.yml) starts CI on a branch it brought up to date, since
  # pushes made with the workflow token start no workflows.
  workflow_dispatch:

# A newer push to the same pull request cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static checks and the unit tests run as parallel jobs; "Lint, typecheck and unit tests"
  # at the end is the one name the branch ruleset requires, and it fails if any of them did.
  static:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The Prisma client is generated from the schema, so it is rebuilt on every run.
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The layers that matter, dead code and strict indexing in the money folders (after typecheck,
      # whose route types it reads).
      - run: npm run check:rules

  # How much of the tests this run needs (docs/ci.md): the whole suite on main, what the diff reaches
  # on most PRs. The jobs below read the answer.
  scope:
    name: Test scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      shards: ${{ steps.scope.outputs.shards }}
      total: ${{ steps.scope.outputs.total }}
      args: ${{ steps.scope.outputs.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - id: scope
        run: node scripts/test-scope.mjs
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  unit:
    name: Unit tests (${{ matrix.shard }}/${{ needs.scope.outputs.total }})
    needs: [scope]
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The database lives in memory: the tests' writes never wait on the runner's disk.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/test
    steps:
      # Two commits: the changed-tests run compares the test merge with its first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      # Vitest starts the files that took longest last time first, from its results file, so a
      # shard doesn't end on one slow file running alone. Kept between runs, per shard.
      - uses: actions/cache@v6
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: vitest-results-${{ matrix.shard }}-
      - name: No waiting on commits (a throwaway database)
        run: node scripts/fast-test-postgres.mjs "$TEST_DATABASE_URL"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Row-level security on every table, as each deploy does
        run: node scripts/rls-protect.mjs "$TEST_DATABASE_URL"
      # Trial and retention cleanup delete every expired sample person in the database, and the
      # learning loop rebuilds its stats from every person in it (which ranking reads), so they
      # run on their own after shard 1's tests, never alongside tests that make people.
      # The JSON reports go to the flake list (scripts/flake-list.mjs).
      - run: >-
          npx vitest run --shard=${{ matrix.shard }}/${{ needs.scope.outputs.total }}
          ${{ needs.scope.outputs.args }}
          --reporter=default --reporter=json --outputFile.json=ci-results/unit.json
          --exclude src/lib/trial.integration.test.ts
          --exclude src/lib/retention.integration.test.ts
          --exclude src/lib/learning.integration.test.ts
      - if: matrix.shard == 1
        name: Trial, retention and learning-loop tests, alone
        run: >-
          npx vitest run --no-file-parallelism
          ${{ needs.scope.outputs.args }}
          --reporter=default --reporter=json --outputFile.json=ci-results/unit-alone.json
          src/lib/trial.integration.test.ts src/lib/retention.integration.test.ts
          src/lib/learning.integration.test.ts
      - name: Keep the results for the flake list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-unit-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 3

  # Every route, action and page attacked as nobody and as someone else, on a database of its own
  # (docs/security/access-proof.md). Alone because it writes for every person and table it finds.
  access-proof:
    name: Access proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate
      - name: No waiting on commits (a throwaway database)
        run: node scripts/fast-test-postgres.mjs "$TEST_DATABASE_URL"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Row-level security on every table, as each deploy does
        run: node scripts/rls-protect.mjs "$TEST_DATABASE_URL"
      - run: npm run test:access
      - name: Keep what each attack found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: access-proof
          path: test-results/access-proof.json
          retention-days: 7

  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    needs: [scope, static, unit, access-proof]
    if: always()
    steps:
      # Unit tests may skip only on a docs-only PR. Skipped for any other reason, this fails.
      - name: Fail if any part failed or was skipped
        run: |
          echo "scope: ${{ needs.scope.outputs.mode }}, static: ${{ needs.static.result }}, unit: ${{ needs.unit.result }}, access proof: ${{ needs.access-proof.result }}"
          test "${{ needs.scope.result }}" = success
          test "${{ needs.static.result }}" = success
          test "${{ needs.access-proof.result }}" = success
          test "${{ needs.unit.result }}" = success || { test "${{ needs.scope.outputs.mode }}" = docs && test "${{ needs.unit.result }}" = skipped; }

  # The end-to-end tests run against a production build, made once here and handed to the
  # shards: `next start` serves every page at once, where `next dev` compiled each page on its
  # first visit, which made the shards slow and their timings flaky.
  e2e-build:
    name: End-to-end build
    needs: [scope]
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    # How much to test (docs/ci.md). Every PR push: the tests tagged @critical, on a computer. Main,
    # whatever started the run (the merge train starts main's runs with workflow_dispatch, so
    # "push" alone skipped them; 10-27 a dock change reached main untested): every test on a
    # computer, and the phone project runs nightly (e2e-mobile.yml). A PR labelled "e2e": every
    # test on both.
    outputs:
      shards: ${{ steps.scope.outputs.shards }}
      total: ${{ steps.scope.outputs.total }}
      args: ${{ steps.scope.outputs.args }}
    steps:
      - id: scope
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          LABELLED: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          if [ "$ON_MAIN" = true ]; then
            printf 'shards=[1,2,3]\ntotal=3\nargs=--project=chromium\n' >> "$GITHUB_OUTPUT"
          elif [ "$LABELLED" = true ]; then
            printf 'shards=[1,2,3]\ntotal=3\nargs=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'shards=[1]\ntotal=1\nargs=--grep @critical --project=chromium\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      # The build's own cache: an unchanged page isn't built again.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'prisma/schema.prisma') }}
          restore-keys: next-build-${{ hashFiles('package-lock.json') }}-
      # The landing page is built ahead, so what it shows (Try Jane) is decided here; the same
      # switches are on when the server runs (playwright.config.ts).
      - run: npm run build
        env:
          TRY_JANE: "1"
          DEMO_BANK: "1"
          DEMO_ADVICE: "1"
          SIMULATED_AGENT: "1"
      # Each main page's first-load JavaScript against src/config/perf-budget.json.
      - name: Check the first-load JavaScript budget
        run: npm run check:perf-budget
      - name: Pack the build (without its cache)
        run: tar --exclude=.next/cache -cf next-build.tar .next
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: next-build.tar
          retention-days: 1

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/${{ needs.e2e-build.outputs.total }})
    # Each shard serves the one build; with no page to compile, it costs only its minute of setup.
    needs: [e2e-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-build.outputs.shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The database lives in memory: the tests' writes never wait on the runner's disk.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/e2e
      # playwright.config.ts: `next start` on the build, with what the tests need turned on.
      E2E_PROD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
      - name: Unpack the build
        run: tar -xf next-build.tar
      - run: npx playwright install --with-deps chromium
      - name: No waiting on commits (a throwaway database)
        run: node scripts/fast-test-postgres.mjs "$E2E_DATABASE_URL"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.E2E_DATABASE_URL }}
      - name: Row-level security on every table, as each deploy does
        run: node scripts/rls-protect.mjs "$E2E_DATABASE_URL"
      - run: >-
          npm run test:e2e --
          ${{ needs.e2e-build.outputs.args }}
          --shard=${{ matrix.shard }}/${{ needs.e2e-build.outputs.total }}
      - name: Keep the results for the flake list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 3
      # A flaky failure can't be read from the log alone: keep its error context and the retry's
      # trace (npx playwright show-trace) for a week.
      - name: Keep the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The one end-to-end result the branch ruleset requires: it passes when the build and every
  # shard passed, so auto-merge waits for the shards by itself.
  e2e-result:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [scope, e2e-build, e2e]
    if: always()
    steps:
      # They may skip only on a docs-only PR. Skipped for any other reason, this fails.
      - name: Fail if the build or any shard failed, was cancelled or skipped
        run: |
          echo "scope: ${{ needs.scope.outputs.mode }}, build: ${{ needs.e2e-build.result }}, e2e: ${{ needs.e2e.result }}"
          ok() { test "$1" = success || { test "${{ needs.scope.outputs.mode }}" = docs && test "$1" = skipped; }; }
          ok "${{ needs.e2e-build.result }}" && ok "${{ needs.e2e.result }}"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails on known high or critical vulnerabilities in what ships to production.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
