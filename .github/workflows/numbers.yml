# The numbers page: is autonomy holding? Once a day a plain script reads GitHub and git and writes
# one page to the ops-numbers branch. No model and no secret but this workflow's own token. The
# repository is public, so only counts, times and PR numbers are written.
name: Numbers

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: numbers
  cancel-in-progress: false

jobs:
  numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/ops/numbers.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOUNDER_LOGINS: ${{ vars.FOUNDER_LOGINS }}
