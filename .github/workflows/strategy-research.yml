name: Strategy research

# The practice strategies replayed on real Alpaca daily bars, on demand (Phase AW, Stage A):
# every strategy in the library x every level x its small grid x several start years, chosen
# walk-forward (src/planning/strategies/select.ts). Results and a summary are uploaded as the
# "strategy-research" artifact; read them with `gh run download`. Nothing is committed from here,
# and nothing trades: practice research only. Run with `gh workflow run strategy-research.yml
# --ref <branch>`; the branch must have src/lib/investments/strategy-research.cli.test.ts.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "daily (the strategy library on daily bars), intraday (the Very high day-trading rules on 5-minute bars) catalog (every catalog strategy, walk-forward with the haircut) crypto (the crypto rules on Alpaca's crypto bars) regimes (every catalog strategy through 2008, 2020 and 2022 on Yahoo's longer history) or agent (the 24-hour agent: every strategy at 15 minutes and 1 hour on crypto and US funds); alpaca only for intraday, catalog, crypto and agent"
        default: daily
        type: choice
        options: [daily, intraday, catalog, crypto, regimes, agent]
      source:
        description: "alpaca (the repo's Alpaca secrets) or fixture (the committed keyless closes)"
        default: alpaca
        type: choice
        options: [alpaca, fixture]
      from:
        description: "First day of bars to fetch (YYYY-MM-DD)"
        default: "2016-01-01"
      feed:
        description: "Alpaca feed: sip (full history; free for bars older than 15 minutes) or iex (from mid-2020 only)"
        default: sip
        type: choice
        options: [sip, iex]

permissions:
  contents: read

concurrency:
  group: strategy-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bars:
    name: Fetch daily bars
    if: inputs.kind == 'daily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the strategy universe's bars
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          STRATEGY_RESEARCH: fetch
          RESEARCH_SOURCE: ${{ inputs.source }}
          RESEARCH_FROM: ${{ inputs.from }}
          RESEARCH_FEED: ${{ inputs.feed }}
          RESEARCH_DIR: research
        run: |
          if [ "$RESEARCH_SOURCE" = "alpaca" ] && { [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; }; then
            echo "::error::Alpaca secrets not set (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY). Add them as repository secrets, or run with source=fixture."
            exit 1
          fi
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
      - uses: actions/upload-artifact@v7
        with:
          name: bars
          path: research/bars.json
          retention-days: 3

  level:
    name: Level ${{ matrix.level }}
    needs: bars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: bars
          path: research
      - name: Replay every strategy for the level
        env:
          STRATEGY_RESEARCH: level
          RESEARCH_LEVEL: ${{ matrix.level }}
          RESEARCH_DIR: research
        run: npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
      - uses: actions/upload-artifact@v7
        with:
          name: level-${{ matrix.level }}
          path: research/level-${{ matrix.level }}.json
          retention-days: 7

  summary:
    name: Summary
    needs: level
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: level-*
          path: research
          merge-multiple: true
      - name: Summarise
        env:
          STRATEGY_RESEARCH: summary
          RESEARCH_DIR: research
        run: |
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
          cat research/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: strategy-research
          path: |
            research/results.json
            research/summary.md
          retention-days: 30

  intraday:
    name: Day-trading rules
    if: inputs.kind == 'intraday'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Replay every day-trading rule on 5-minute bars
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          STRATEGY_RESEARCH: intraday
          RESEARCH_FROM: ${{ inputs.from }}
          RESEARCH_FEED: ${{ inputs.feed }}
          RESEARCH_DIR: research
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Alpaca secrets not set (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY)."
            exit 1
          fi
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
          cat research/intraday-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: intraday-research
          path: |
            research/intraday-evidence.ts
            research/intraday-summary.md
          retention-days: 30

  catalog:
    name: Strategy catalog
    if: inputs.kind == 'catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Replay the whole catalog on daily closes
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          STRATEGY_RESEARCH: catalog
          RESEARCH_FROM: ${{ inputs.from }}
          RESEARCH_FEED: ${{ inputs.feed }}
          RESEARCH_DIR: research
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Alpaca secrets not set (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY)."
            exit 1
          fi
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
          cat research/strategy-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-research
          path: |
            research/strategy-results.md
            research/catalog-evidence.ts
            research/catalog-curves.ts
            research/catalog-results.json
            research/sensitivity.md
          retention-days: 30

  crypto:
    name: Crypto rules
    if: inputs.kind == 'crypto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Replay the crypto rules on Alpaca's crypto bars
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          STRATEGY_RESEARCH: crypto
          RESEARCH_FROM: ${{ inputs.from }}
          RESEARCH_DIR: research
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Alpaca secrets not set (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY)."
            exit 1
          fi
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
          cat research/crypto-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: crypto-research
          path: |
            research/crypto-summary.md
            research/crypto-results.json
          retention-days: 30

  regimes:
    name: Through past regimes
    if: inputs.kind == 'regimes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Every catalog strategy through 2008, 2020 and 2022
        env:
          STRATEGY_RESEARCH: regimes
          RESEARCH_FROM: "2005-01-01"
          RESEARCH_DIR: research
        run: |
          npx vitest run src/lib/investments/strategy-research.cli.test.ts --silent=false
          cat research/regimes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: regimes-research
          path: |
            research/regimes.md
            research/regimes.json
            research/catalog-regimes.ts
          retention-days: 30

  agent:
    name: The 24-hour agent at 15 minutes and 1 hour
    if: inputs.kind == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Every strategy bar by bar on crypto and US funds, walk-forward with the haircut
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_FEED: ${{ inputs.feed }}
          INTRADAY_AGENT: all
          INTRADAY_STOCKS_FROM: ${{ inputs.from }}T00:00:00.000Z
          RESEARCH_DIR: research
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Alpaca secrets not set (ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY)."
            exit 1
          fi
          npx vitest run src/lib/trading-agent/intraday-research.cli.test.ts --silent=false
          cat research/intraday.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-research
          path: |
            research/intraday.md
            research/intraday-agent-evidence.ts
            research/intraday-agent.json
          retention-days: 30
