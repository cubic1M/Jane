# Temporary: regenerates package-lock.json on GitHub's runners, because the session that
# wrote step 2 could not reach the npm registry. Removed once the lockfile is committed.
name: Update lockfile

on:
  push:
    branches: [claude/auth-schema-core-helpers-n113ig]
    paths: [.github/workflows/update-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Show next-auth versions
        run: npm view next-auth dist-tags
      - run: npm install
      - run: npm ls next-auth
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Update lockfile for next-auth"
          git push
