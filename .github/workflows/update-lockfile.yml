# Temporary: installs new dependencies on GitHub's runners and commits the lockfile,
# because the session writing this can't reach the npm registry. Removed afterwards.
name: Update lockfile

on:
  push:
    branches: [claude/auth-schema-core-helpers-n113ig]
    paths: [.github/workflows/update-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install @anthropic-ai/sdk@latest
      - run: npm ls @anthropic-ai/sdk
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add @anthropic-ai/sdk"
          git push
