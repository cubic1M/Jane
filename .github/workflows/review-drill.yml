name: Review drill

# Once a week, after the Weak-test finder: plants bugs Stryker's tests missed in diffs, asks the
# reviewers about them, and records how many they caught (docs/gates.md). Nothing is pushed and no PR
# is opened. Off until a founder sets the REVIEWER_ON variable.
on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  drill:
    name: Plant and ask
    if: vars.REVIEWER_ON == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: reviewers
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Real past commits to hide each plant among.
          fetch-depth: 80
      - name: The newest mutation report from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow mutation.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$id" ] || { echo "::error::No mutation report yet."; exit 1; }
          gh run download "$id" -n mutation-report -D "$RUNNER_TEMP/mutation"
      - run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$VERSION"
        env:
          VERSION: ${{ vars.REVIEWER_CLAUDE_CODE_VERSION }}
      - run: >-
          mkdir -p "$RUNNER_TEMP/out" && node .github/scripts/reviewer/drill.mjs
          --report "$RUNNER_TEMP/mutation/mutation.json" --count 5 --week "$(date -u +%G-W%V)"
          --out "$RUNNER_TEMP/out/drill.json"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWER_CLAUDE_TOKEN }}
          REVIEWER_CLAUDE_MODEL: ${{ vars.REVIEWER_CLAUDE_MODEL }}
          REVIEWER_SECOND_KEY: ${{ secrets.REVIEWER_SECOND_KEY }}
          REVIEWER_SECOND_MODEL: ${{ vars.REVIEWER_SECOND_MODEL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drill
          path: ${{ runner.temp }}/out
          retention-days: 90

  # A plain step with no key: one issue holds the record, one comment a week.
  record:
    name: Record the score
    needs: drill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: drill
          path: ${{ runner.temp }}/drill
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(node -p '
            const d = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const lines = Object.entries(d.tally).map(([f, t]) =>
              `- ${f}: caught ${t.caught} of ${d.planted}, ${t.didNotFinish} did not finish, ${t.otherFindings} other findings`);
            [`**${d.week}**`, ...lines].join("\n");
          ' "$RUNNER_TEMP/drill/drill.json")
          title="Planted-bug drill: the record"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          [ -n "$number" ] || number=$(gh issue create --title "$title" --body "One comment a week from review-drill.yml (docs/gates.md)." | sed 's#.*/##')
          gh issue comment "$number" --body "$body"
