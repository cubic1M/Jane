# The daily canary task (canary/README.md). Claude Code gets a fixed small task in an empty folder,
# and tests it never saw score it. Off until a founder sets the repository variable OPS_CANARY to 1
# and the CLAUDE_CODE_OAUTH_TOKEN secret in the ops-canary environment. The agent's job can't write:
# a separate job records only the numbers it passes on. Latest Claude Code on purpose: noticing when
# a new version changes things is the point.
name: Canary task

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# GitHub's own machines, whatever CI_RUNNER says: these jobs hold secrets or a write token, and a
# self-hosted runner keeps what a branch's code leaves on it for the next job (docs/ci.md).
jobs:
  run:
    if: vars.OPS_CANARY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ops-canary
    outputs:
      record: ${{ steps.canary.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            canary
            scripts/ops
            .github/scripts/gates
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code
      - id: canary
        run: echo "record=$(node scripts/ops/canary.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  record:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/ops/record-result.mjs canary.jsonl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECORD: ${{ needs.run.outputs.record }}
