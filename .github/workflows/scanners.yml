# Security scanners (docs/security/scanners.md). CodeQL reads how data flows through the code;
# Semgrep runs its free rules plus two of Jane's own, which no generic scanner can know: a query on a
# user-owned table with no user in it, and a token or statement content going to the logs. On a pull
# request each fails only on what that pull request adds or touches; on main and each week they keep
# everything they found as a run artifact. Neither needs GitHub's code scanning (paid on a private
# repository), so neither uploads to the Security tab.
name: Scanners

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Only the newest commit is worth scanning.
concurrency:
  group: scanners-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub's own machines, whatever CI_RUNNER says: CodeQL alone takes several GB, and with three other
# jobs at once it ran the CI server out of memory (docs/ci.md).
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request is compared with its base commit, so the base must be here.
          fetch-depth: 0
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: codeql
          upload: never
          output: codeql-results
      - name: Keep what it found
        if: always() && hashFiles('codeql-results/*.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
      # A pull request fails on a finding in a file it changes. Main only keeps the list, so old
      # findings being worked through don't turn its commits red.
      - name: Findings in what this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE"...HEAD > changed.txt
          python3 - <<'PY'
          import glob, json, sys
          changed = set(open("changed.txt").read().split())
          found = []
          for path in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(path)).get("runs", []):
                  for result in run.get("results", []):
                      for loc in result.get("locations", []):
                          uri = loc.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
                          if uri in changed:
                              line = loc["physicalLocation"].get("region", {}).get("startLine", "?")
                              found.append(f"{uri}:{line} {result.get('ruleId')}: {result.get('message', {}).get('text', '')[:200]}")
          for f in found:
              print(f)
          print(f"{len(found)} CodeQL finding(s) in files this pull request changes.")
          sys.exit(1 if found else 0)
          PY

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SEMGREP: /tmp/semgrep/bin/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request is compared with its base commit, so the base must be here.
          fetch-depth: 0
      # setuptools: this Semgrep still imports pkg_resources, which newer setuptools removed.
      - name: Install Semgrep
        run: |
          python3 -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install --quiet semgrep==1.136.0 "setuptools<81"
      - name: Jane's own rules catch their test cases
        run: $SEMGREP --metrics=off --test .semgrep/rules
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A pull request fails on what it adds. Main only reports, so old findings being worked
          # through don't turn its commits red.
          mode=""
          if [ -n "$BASE" ]; then mode="--error --baseline-commit $BASE"; fi
          $SEMGREP scan --metrics=off $mode \
            --config .semgrep/rules \
            --config p/typescript --config p/nextjs --config p/react --config p/nodejs \
            --config p/owasp-top-ten --config p/secrets \
            --exclude src/generated --exclude docs --exclude .semgrep \
            --exclude src/security/access-proof/fixtures \
            --exclude '*.test.ts' --exclude '*.test.tsx' \
            --sarif --output semgrep.sarif
      - name: Keep what it found
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30
