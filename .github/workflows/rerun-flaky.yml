name: Re-run failed CI once

# A failed CI run (main or a PR) gets its failed jobs re-run once by itself. Most failures under
# load are end-to-end timing flakes that pass on a second try; a real break fails again and stays
# red. Only the first attempt is re-run, so this never loops.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run failed jobs
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Not when the branch has moved on: re-running an old commit's run joins the PR's concurrency
      # group and cancels the newer push's run (seen on #1315, 11-03).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            newest=$(gh run list -R "$REPO" --workflow CI --branch "$BRANCH" --limit 1 --json headSha --jq '.[0].headSha')
            [ "$newest" = "$SHA" ] || { echo "The branch has moved on."; exit 0; }
          fi
          gh run rerun "$RUN" --failed -R "$REPO"
