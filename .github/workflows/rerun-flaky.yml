name: Re-run failed CI once

# A failed CI run (main or a PR) gets its failed jobs re-run once by itself. Most failures under
# load are end-to-end timing flakes that pass on a second try; a real break fails again and stays
# red. Only the first attempt is re-run, so this never loops.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run failed jobs
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh run rerun "${{ github.event.workflow_run.id }}" --failed -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
